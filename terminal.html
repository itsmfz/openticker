function genSeries(base, vol=0.01, n=90, seed=1){
  const out=[]; let p=base*0.85; let s=seed;
  for(let i=0;i<n;i++){ s=(s*9301+49297)%233280; const r=(s/233280)-0.5;
    p = p*(1+r*vol*2) + (base-p)*0.02;
    out.push(p);
  }
  out[n-1]=base;
  return out;
}

function genReturnSeries(targetReturn, n, vol, seed){
  const out = [0]; let s = seed;
  for(let i=1; i<n; i++){
    s = (s*9301+49297)%233280; const r = (s/233280)-0.5;
    const targetAtI = targetReturn * (i/(n-1));
    const drift = (targetAtI - out[i-1]) * 0.07;
    out.push(out[i-1] + drift + r*vol*100);
  }
  out[n-1] = targetReturn;
  return out;
}

function downloadCSV(filename, rows){
  if(!rows || !rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = v => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>esc(r[h])).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function LineChart({ data, color="#2dd4bf", width=600, height=260, fill=true, showAxes=true }){
  if(!data || !data.length) return null;
  const pad = { l:48, r:12, t:14, b:24 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max-min || 1;
  const pts = data.map((v,i)=>{
    const x = pad.l + (i/(data.length-1))*w;
    const y = pad.t + h - ((v-min)/range)*h;
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  const areaPath = path + ` L ${pts[pts.length-1][0]},${pad.t+h} L ${pts[0][0]},${pad.t+h} Z`;
  const ticks = 5;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" preserveAspectRatio="none">
      {showAxes && Array.from({length:ticks}).map((_,i)=>{
        const y = pad.t + (i/(ticks-1))*h;
        const v = max - (i/(ticks-1))*range;
        return (<g key={i}>
          <line x1={pad.l} x2={pad.l+w} y1={y} y2={y} stroke="#21262d" strokeDasharray="2 3" />
          <text x={pad.l-6} y={y+3} fontSize="9" textAnchor="end" fill="#7d8590" className="mono">{fmt(v,2)}</text>
        </g>);
      })}
      {fill && <path d={areaPath} fill={color} opacity="0.12" />}
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" />
      {showAxes && (<g>
        <text x={pad.l} y={height-6} fontSize="9" fill="#7d8590" className="mono">-90d</text>
        <text x={pad.l+w} y={height-6} fontSize="9" textAnchor="end" fill="#7d8590" className="mono">now</text>
      </g>)}
    </svg>
  );
}

function Sparkline({ data, color="#2dd4bf", width=80, height=24 }){
  if(!data || !data.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max-min || 1;
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*width;
    const y = height - ((v-min)/range)*height;
    return x+","+y;
  }).join(" ");
  return <svg width={width} height={height} className="inline-block"><polyline points={pts} fill="none" stroke={color} strokeWidth="1.2" /></svg>;
}

function PieChart({ slices, size=200 }){
  const total = slices.reduce((a,b)=>a+b.value,0);
  let acc = 0; const r = size/2 - 2; const cx = size/2, cy = size/2;
  return (
    <svg width={size} height={size}>
      {slices.map((s,i)=>{
        const start = (acc/total)*Math.PI*2 - Math.PI/2; acc += s.value;
        const end = (acc/total)*Math.PI*2 - Math.PI/2;
        const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
        const x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
        const large = end-start > Math.PI ? 1 : 0;
        const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
        return <path key={i} d={d} fill={s.color} stroke="#0d1117" strokeWidth="1" />;
      })}
      <circle cx={cx} cy={cy} r={r*0.5} fill="#161b22" stroke="#21262d" />
    </svg>
  );
}

function MultiLineChart({ series, labels, width=720, height=320, xValues }){
  const pad = { l:50, r:14, t:14, b:30 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  const all = series.flatMap(s=>s.data);
  const min = Math.min(...all), max = Math.max(...all);
  const range = max-min || 1;
  const n = series[0].data.length;
  // use log scale on x for nicer maturity spread
  const xMap = xValues ? xValues.map(v=>Math.log(v)) : Array.from({length:n}, (_,i)=>i);
  const xMin = Math.min(...xMap), xMax = Math.max(...xMap);
  const xRange = xMax-xMin || 1;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} className="w-full" preserveAspectRatio="none">
      {Array.from({length:5}).map((_,i)=>{
        const y = pad.t + (i/4)*h;
        const v = max - (i/4)*range;
        return (<g key={i}>
          <line x1={pad.l} x2={pad.l+w} y1={y} y2={y} stroke="#21262d" strokeDasharray="2 3" />
          <text x={pad.l-6} y={y+3} fontSize="9" textAnchor="end" fill="#7d8590" className="mono">{fmt(v,2)}</text>
        </g>);
      })}
      {labels && labels.map((l,i)=>{
        const x = pad.l + ((xMap[i]-xMin)/xRange)*w;
        return <text key={i} x={x} y={height-10} fontSize="9" textAnchor="middle" fill="#7d8590" className="mono">{l}</text>;
      })}
      {series.map((s,si)=>{
        const path = s.data.map((v,i)=>{
          const x = pad.l + ((xMap[i]-xMin)/xRange)*w;
          const y = pad.t + h - ((v-min)/range)*h;
          return (i===0?"M":"L")+x+","+y;
        }).join(" ");
        return <g key={si}>
          <path d={path} fill="none" stroke={s.color} strokeWidth="1.7" />
          {s.data.map((v,i)=>{
            const x = pad.l + ((xMap[i]-xMin)/xRange)*w;
            const y = pad.t + h - ((v-min)/range)*h;
            return <circle key={i} cx={x} cy={y} r="2.5" fill={s.color} />;
          })}
        </g>;
      })}
    </svg>
  );
}

function Modal({ title, onClose, children, maxWidth="max-w-3xl" }){
  useEffect(()=>{
    const h = e => { if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown",h);
  },[onClose]);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
      <div className={`panel ${maxWidth} w-full max-h-[85vh] overflow-auto`} onClick={e=>e.stopPropagation()}>
        <div className="panel-header px-3 py-2 flex items-center justify-between">
          <div className="text-[11px] font-semibold uppercase tracking-widest muted">{title}</div>
          <button onClick={onClose} className="muted hover:accent text-sm">✕</button>
        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}

function buildPortfolioRows(){
  return PORTFOLIO.map(p=>{
    const last = EQUITIES[p.ticker]?.price ?? p.avgCost;
    const value = last * p.shares;
    const cost = p.avgCost * p.shares;
    const pnl = value - cost;
    const ret = (pnl/cost)*100;
    return { ...p, last, value, cost, pnl, ret };
  });
}

// ============== COMPARISON CHART ==============
function ComparisonChart({ series, range, height=340 }){
  const [hover, setHover] = useState(null);
  const svgRef = useRef(null);
  const width = 720;
  const pad = { l:54, r:14, t:14, b:30 };
  const w = width - pad.l - pad.r;
  const h = height - pad.t - pad.b;
  if(!series.length) return <div className="muted text-sm text-center py-12">Add a ticker above to start comparing.</div>;
  const allVals = series.flatMap(s=>s.data);
  const min = Math.min(0, ...allVals), max = Math.max(0, ...allVals);
  const rng = max-min || 1;
  const n = series[0].data.length;
  const onMove = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    const x = ((e.clientX-rect.left)/rect.width)*width;
    if(x<pad.l || x>pad.l+w){ setHover(null); return; }
    const idx = Math.round(((x-pad.l)/w)*(n-1));
    setHover({ idx, x: pad.l + (idx/(n-1))*w });
  };
  return (
    <div className="relative">
      <svg ref={svgRef} viewBox={`0 0 ${width} ${height}`} className="w-full" preserveAspectRatio="none" onMouseMove={onMove} onMouseLeave={()=>setHover(null)}>
        {Array.from({length:5}).map((_,i)=>{
          const y = pad.t + (i/4)*h;
          const v = max - (i/4)*rng;
          return <g key={i}>
            <line x1={pad.l} x2={pad.l+w} y1={y} y2={y} stroke="#21262d" strokeDasharray="2 3" />
            <text x={pad.l-6} y={y+3} fontSize="9" textAnchor="end" fill="#7d8590" className="mono">{(v>=0?"+":"")+v.toFixed(1)+"%"}</text>
          </g>;
        })}
        {min<=0 && max>=0 && (() => {
          const y = pad.t + h - ((0-min)/rng)*h;
          return <line x1={pad.l} x2={pad.l+w} y1={y} y2={y} stroke="#484f58" strokeWidth="1" />;
        })()}
        {series.map((s,si)=>{
          const path = s.data.map((v,i)=>{
            const x = pad.l + (i/(n-1))*w;
            const y = pad.t + h - ((v-min)/rng)*h;
            return (i===0?"M":"L")+x+","+y;
          }).join(" ");
          return <path key={si} d={path} fill="none" stroke={s.color} strokeWidth="1.7" />;
        })}
        <text x={pad.l} y={height-10} fontSize="9" fill="#7d8590" className="mono">{range==="1W"?"-7d":range==="1M"?"-30d":range==="3M"?"-90d":range==="6M"?"-180d":range==="1Y"?"-1y":range==="3Y"?"-3y":"-5y"}</text>
        <text x={pad.l+w} y={height-10} fontSize="9" textAnchor="end" fill="#7d8590" className="mono">now</text>
        {hover && (
          <g>
            <line x1={hover.x} x2={hover.x} y1={pad.t} y2={pad.t+h} stroke="#7d8590" strokeDasharray="2 2" />
            {series.map((s,si)=>{
              const v = s.data[hover.idx];
              const y = pad.t + h - ((v-min)/rng)*h;
              return <circle key={si} cx={hover.x} cy={y} r="3.5" fill={s.color} stroke="#0d1117" strokeWidth="1.2" />;
            })}
          </g>
        )}
      </svg>
      {hover && (
        <div className="absolute panel px-2 py-1.5 mono text-[10px] pointer-events-none"
             style={{ left:`${(hover.x/width)*100}%`, top:6, transform:"translateX(8px)" }}>
          <div className="muted uppercase tracking-widest mb-1">{range} · point {hover.idx+1}/{n}</div>
          {series.map((s,si)=>(
            <div key={si} className="flex items-center gap-2">
              <span className="w-2 h-0.5 inline-block" style={{background:s.color}}></span>
              <span className="muted w-12">{s.label}</span>
              <span className="ml-auto" style={{color:s.color}}>{(s.data[hover.idx]>=0?"+":"")+s.data[hover.idx].toFixed(2)}%</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  { ticker:"US30Y", name:"US Treasury 30Y", yield:4.62, rating:"AAA", maturity:"2055", duration:17.6 },
  { ticker:"AAPL30", name:"Apple 3.85% 2043", yield:5.12, rating:"AA", maturity:"2043", duration:12.8 },
  { ticker:"MSFT35", name:"Microsoft 2.92% 2052", yield:5.34, rating:"AAA", maturity:"2052", duration:18.2 },
  { ticker:"JPM27", name:"JPMorgan 4.20% 2027", yield:5.45, rating:"A", maturity:"2027", duration:2.6 },
  { ticker:"XOM33", name:"Exxon 3.10% 2033", yield:5.21, rating:"AA", maturity:"2033", duration:7.2 },
  { ticker:"TSLA30", name:"Tesla 5.30% 2030", yield:6.85, rating:"BBB", maturity:"2030", duration:4.8 },
  { ticker:"BA28", name:"Boeing 5.15% 2028", yield:6.42, rating:"BBB", maturity:"2028", duration:3.4 },
];

function parseBQL(q){
  // Returns { entity, conditions:[{field,op,value}], error }
  const out = { entity:null, conditions:[], error:null };
  if(!q) return { ...out, error:"Empty query" };
  const m = q.match(/^\s*SHOW\s+(\w+)\s*(WHERE\s+(.+))?$/i);
  if(!m) return { ...out, error:"Syntax: SHOW <entity> [WHERE <condition> [AND <condition>...]]" };
  out.entity = m[1].toLowerCase();
  if(m[3]){
    const parts = m[3].split(/\s+AND\s+/i);
    for(const p of parts){
      const cm = p.match(/^\s*(\w+)\s*(=|!=|>=|<=|>|<)\s*['"]?([^'"]+?)['"]?\s*$/);
      if(!cm) return { ...out, error:`Bad condition: ${p}` };
      let v = cm[3].trim();
      const numMatch = v.match(/^([\d.]+)\s*(B|M|K|T|%)?$/i);
      let numeric;
      if(numMatch){
        let n = parseFloat(numMatch[1]);
        const suf = (numMatch[2]||"").toUpperCase();
        if(suf==="T") n*=1000; else if(suf==="B") n=n; else if(suf==="M") n=n/1000; else if(suf==="K") n=n/1_000_000;
        numeric = n;
      }
      out.conditions.push({ field:cm[1].toLowerCase(), op:cm[2], rawValue:v, numeric });
    }
  }
  return out;
}

function evalCondition(row, c){
  let v;
  switch(c.field){
    case "pe_ratio": case "pe": v=row.pe; break;
    case "market_cap": case "mcap": v=row.mcap; break;
    case "dividend_yield": case "div_yield": v=row.divYield; break;
    case "wk_return": case "52w_return": v=row.wkReturn; break;
    case "sector": v=row.sector; break;
    case "region": v=row.region; break;
    case "yield": v=row.yield; break;
    case "rating": v=row.rating; break;
    case "duration": v=row.duration; break;
    case "price": v=row.price; break;
    default: return false;
  }
  if(typeof v === "string"){
    if(c.op==="=") return v.toLowerCase()===c.rawValue.toLowerCase();
    if(c.op==="!=") return v.toLowerCase()!==c.rawValue.toLowerCase();
    return false;
  }
  const cmp = c.numeric !== undefined ? c.numeric : parseFloat(c.rawValue);
  if(isNaN(cmp)) return false;
  switch(c.op){
    case "=": return v===cmp;
    case "!=": return v!==cmp;
    case ">": return v>cmp;
    case "<": return v<cmp;
    case ">=": return v>=cmp;
    case "<=": return v<=cmp;
  }
  return false;
}

function BQLModule({ navigate }){
  const [query, setQuery] = useState("SHOW stocks WHERE pe_ratio < 20 AND market_cap > 500B");

  const parsed = useMemo(()=>parseBQL(executed),[executed]);
  const results = useMemo(()=>{
    if(parsed.error) return [];

      dataset = pr.map(r=>{ const e = EQUITIES[r.ticker]; return { ticker:r.ticker, name:e?.name, sector:r.sector, region:e?.region, pe:e?.pe, mcap:e?.mcap, divYield:e?.divYield, wkReturn:e?.wkReturn, value:r.value, ret:r.ret, price:r.last }; });
    }
    return dataset.filter(row => parsed.conditions.every(c => evalCondition(row, c)));
  },[parsed]);

  const sorted = useMemo(()=>{
    if(!sortKey) return results;
    return [...results].sort((a,b)=>{
      const av=a[sortKey], bv=b[sortKey];
      if(typeof av==="string") return sortDir*(av.localeCompare(bv));
      return sortDir*((av??0)-(bv??0));
    });
  },[results, sortKey, sortDir]);

  const sortBy = k => { if(sortKey===k) setSortDir(d=>-d); else { setSortKey(k); setSortDir(1); } };

  const exportRows = sorted.map(r=>({Ticker:r.ticker,Name:r.name,Sector:r.sector,PE:r.pe,MarketCap:r.mcap,DivYield:r.divYield,Return52W:r.wkReturn}));

  return (
    <div className="grid grid-cols-12 gap-2">
      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">BQL Query Engine</div>
        <div className="p-4">
          <div className="text-[10px] muted uppercase tracking-wider mb-2">Example Queries</div>
          <div className="flex flex-wrap gap-2 mb-4">
            {BQL_EXAMPLES.map(q=>(
              <span key={q} className="chip mono" onClick={()=>{ setQuery(q); setExecuted(q); }}>{q}</span>
            ))}
          </div>
          <div className="text-[10px] muted uppercase tracking-wider mb-2">Query</div>
          <form onSubmit={e=>{e.preventDefault(); setExecuted(query);}} className="flex gap-2">
            <div className="flex-1 flex items-center bg-[#0d1117] border border-[#30363d] px-3 py-2">
              <span className="accent mono text-xs mr-2">BQL&gt;</span>
              <input className="bare mono text-sm flex-1 bg-transparent caret-[#2dd4bf]" value={query} onChange={e=>setQuery(e.target.value)} placeholder="SHOW stocks WHERE ..." />
            </div>
            <button className="mono text-xs uppercase tracking-widest accent border border-[#2dd4bf] px-4 hover:bg-[#2dd4bf]/10">Run</button>
          </form>
          <div className="mt-3 flex flex-wrap gap-x-6 gap-y-1 text-[10px] muted mono">
            <span><span className="accent">entities:</span> stocks, bonds, portfolio</span>
            <span><span className="accent">fields:</span> pe_ratio, market_cap, sector, region, dividend_yield, wk_return, yield, rating, duration, price</span>
            <span><span className="accent">operators:</span> = != &gt; &lt; &gt;= &lt;=</span>
            <span><span className="accent">suffixes:</span> K M B T %</span>
          </div>
        </div>
      </div>

      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-widest muted">Results <span className="ml-2 accent mono">{parsed.error? "—" : sorted.length+" rows"}</span></div>
          {!parsed.error && sorted.length>0 && <ExportBtn filename="bql_results.csv" rows={exportRows} />}
        </div>
        {parsed.error ? (
          <div className="p-4 mono text-xs neg">ERROR: {parsed.error}</div>
        ) : sorted.length===0 ? (
          <div className="p-4 mono text-xs muted">No results match your query.</div>
        ) : parsed.entity==="bonds" ? (
          <table className="w-full text-xs mono">
            <thead className="text-[10px] uppercase muted">
              <tr className="border-b border-[#21262d]">
                {["ticker","name","yield","rating","maturity","duration"].map(k=>(
                  <th key={k} className={`px-3 py-1.5 cursor-pointer hover:accent ${k==="ticker"?"text-left":"text-right"}`} onClick={()=>sortBy(k)}>{k.replace("_"," ")} {sortKey===k?(sortDir>0?"▲":"▼"):""}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map(r=>(
                <tr key={r.ticker} className="border-b border-[#21262d] hover:bg-[#1c2128]">
                  <td className="px-3 py-1.5 accent text-left">{r.ticker}</td>
                  <td className="px-3 text-right muted">{r.name}</td>
                  <td className="px-3 text-right">{fmt(r.yield)}%</td>
                  <td className="px-3 text-right">{r.rating}</td>
                  <td className="px-3 text-right">{r.maturity}</td>
                  <td className="px-3 text-right">{fmt(r.duration)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        ) : (
          <table className="w-full text-xs mono">
            <thead className="text-[10px] uppercase muted">
              <tr className="border-b border-[#21262d]">
                {[["ticker","Ticker","left"],["name","Name","left"],["sector","Sector","left"],["mcap","Mkt Cap","right"],["pe","P/E","right"],["divYield","Div %","right"],["wkReturn","52W %","right"]].map(([k,l,a])=>(
                  <th key={k} className={`px-3 py-1.5 cursor-pointer hover:accent text-${a}`} onClick={()=>sortBy(k)}>{l} {sortKey===k?(sortDir>0?"▲":"▼"):""}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map(r=>(
                <tr key={r.ticker} className="border-b border-[#21262d] hover:bg-[#1c2128] cursor-pointer" onClick={()=>navigate(r.ticker+" EQ")}>
                  <td className="px-3 py-1.5 accent">{r.ticker}</td>

          </table>
        )}
      </div>
    </div>
  );
}

// ============== RISK ==============
function RiskModule({ navigate }){
  const cards = [
    { k:"Value at Risk (95%)", v:RISK_METRICS.var95.value, sub:RISK_METRICS.var95.sub, note:RISK_METRICS.var95.changeNote, neg:true },
    { k:"Sharpe Ratio", v:RISK_METRICS.sharpe.value, sub:RISK_METRICS.sharpe.sub, note:RISK_METRICS.sharpe.changeNote, pos:true },
    { k:"Beta (S&P 500)", v:RISK_METRICS.beta.value, sub:RISK_METRICS.beta.sub, note:RISK_METRICS.beta.changeNote },
    { k:"Tracking Error", v:RISK_METRICS.trackingError.value, sub:RISK_METRICS.trackingError.sub, note:RISK_METRICS.trackingError.changeNote },
    { k:"Max Drawdown", v:RISK_METRICS.maxDrawdown.value, sub:RISK_METRICS.maxDrawdown.sub, note:RISK_METRICS.maxDrawdown.changeNote, neg:true },
    { k:"Volatility (σ)", v:RISK_METRICS.volatility.value, sub:RISK_METRICS.volatility.sub, note:RISK_METRICS.volatility.changeNote },
  ];

  const rows = buildPortfolioRows();
  const total = rows.reduce((a,b)=>a+b.value,0);
  // Risk contribution = weight * (sector-dependent vol proxy)
  const sectorVol = { Technology:0.30, Finance:0.22, Energy:0.28, Consumer:0.26, Healthcare:0.16, Industrials:0.23 };
  const riskRows = rows.map(r=>{
    const w = r.value/total;
    const beta = (sectorVol[r.sector]||0.22)/0.20;
    const rc = w * (sectorVol[r.sector]||0.22);
    return { ticker:r.ticker, sector:r.sector, weight:w*100, beta, vol:(sectorVol[r.sector]||0.22)*100, riskContrib:rc };
  });
  const rcSum = riskRows.reduce((a,b)=>a+b.riskContrib,0);
  riskRows.forEach(r=>r.riskPct = (r.riskContrib/rcSum)*100);
  riskRows.sort((a,b)=>b.riskPct-a.riskPct);

  const exportRows = riskRows.map(r=>({Ticker:r.ticker,Sector:r.sector,Weight:r.weight.toFixed(2)+"%",Beta:r.beta.toFixed(2),Volatility:r.vol.toFixed(1)+"%",RiskContribution:r.riskPct.toFixed(2)+"%"}));

  return (
    <div className="grid grid-cols-12 gap-2">
      {cards.map(c=>(
        <div key={c.k} className="col-span-12 sm:col-span-6 lg:col-span-2 panel">
          <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">{c.k}</div>
          <div className="p-3">
            <div className={`mono text-xl font-semibold ${c.neg?"neg":c.pos?"pos":""}`}>{c.v}</div>
            <div className="text-[10px] muted mt-1">{c.sub}</div>
            <div className="text-[10px] muted mt-2 border-t border-[#21262d] pt-1">{c.note}</div>
          </div>
        </div>
      ))}

      <div className="col-span-12 lg:col-span-6 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Factor Exposure</div>
        <div className="p-4 space-y-3">
          {FACTOR_EXPOSURE.map(f=>{
            const pct = Math.min(Math.abs(f.value)*60, 60);
            const pos = f.value>=0;
            return (
              <div key={f.factor} className="flex items-center gap-3">
                <div className="w-20 text-[11px] muted uppercase tracking-wider">{f.factor}</div>
                <div className="flex-1 relative h-3 bg-[#0d1117] border border-[#21262d] rounded-sm">
                  <div className="absolute top-0 bottom-0 left-1/2 w-px bg-[#30363d]"></div>
                  <div className="absolute top-0 bottom-0" style={{ left: pos?"50%":(50-pct)+"%", width:pct+"%", background:pos?"#2dd4bf":"#ef4444", opacity:0.85 }}></div>
                </div>
                <div className={`w-14 text-right mono text-xs ${pos?"pos":"neg"}`}>{sgn(f.value)}</div>
              </div>
            );
          })}
          <div className="text-[10px] muted mt-2">Factor loadings z-scored vs MSCI World benchmark. Positive = overweight.</div>
        </div>
      </div>

      <div className="col-span-12 lg:col-span-6 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-widest muted">Risk Contribution by Holding</div>
          <ExportBtn filename="risk_contribution.csv" rows={exportRows} />
        </div>
        <table className="w-full text-xs mono">
          <thead className="text-[10px] uppercase muted">
            <tr className="border-b border-[#21262d]">
              <th className="text-left px-3 py-1.5">Ticker</th>
              <th className="text-left px-3">Sector</th>
              <th className="text-right px-3">Weight</th>
              <th className="text-right px-3">Beta</th>
              <th className="text-right px-3">σ</th>
              <th className="text-right px-3 pr-3">% Risk</th>
            </tr>
          </thead>
          <tbody>
            {riskRows.map(r=>(
              <tr key={r.ticker} className="border-b border-[#21262d] hover:bg-[#1c2128] cursor-pointer" onClick={()=>navigate(r.ticker+" EQ")}>
                <td className="px-3 py-1.5 accent">{r.ticker}</td>
                <td className="px-3 muted">{r.sector}</td>
                <td className="px-3 text-right">{fmt(r.weight)}%</td>
                <td className="px-3 text-right">{fmt(r.beta)}</td>
                <td className="px-3 text-right">{fmt(r.vol,1)}%</td>
                <td className="px-3 text-right pr-3">
                  <div className="flex items-center gap-2 justify-end">
                    <div className="w-16 h-1.5 bg-[#21262d] rounded-sm overflow-hidden">
                      <div className="h-full accent-bg" style={{width:Math.min(r.riskPct*1.5,100)+"%"}}></div>
                    </div>
                    <span>{fmt(r.riskPct)}%</span>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============== STRESS TEST ==============
function StressModule({ navigate }){
  const [selected, setSelected] = useState("rates_up");
  const [custom, setCustom] = useState({ active:false, rate:0, equity:0, fx:0 });

  const rows = buildPortfolioRows();
  const total = rows.reduce((a,b)=>a+b.value,0);

  const impactPctForRow = (r) => {
    if(custom.active){
      // crude blend
      const sectorEqBeta = { Technology:1.25, Finance:1.10, Energy:0.95, Consumer:1.05, Healthcare:0.70, Industrials:1.15 };
      const sectorRateBeta = { Technology:-3.0, Finance:+1.5, Energy:-0.8, Consumer:-2.0, Healthcare:-1.0, Industrials:-1.5 };
      const sectorFxBeta = { Technology:-0.6, Finance:-0.2, Energy:-0.5, Consumer:-0.3, Healthcare:-0.1, Industrials:-0.5 };
      const eq = (sectorEqBeta[r.sector]||1) * custom.equity;
      const rt = (sectorRateBeta[r.sector]||-1) * (custom.rate/100);
      const fx = (sectorFxBeta[r.sector]||-0.3) * custom.fx;
      return eq + rt + fx;
    }
    const map = SCENARIO_IMPACTS[selected]||{};
    return map[r.sector] ?? 0;
  };

  const impacted = rows.map(r=>{
    const pct = impactPctForRow(r);
    const newValue = r.value * (1 + pct/100);
    return { ...r, impactPct:pct, newValue, dollarImpact: newValue - r.value };
  });
  const newTotal = impacted.reduce((a,b)=>a+b.newValue,0);
  const totalImpact = newTotal - total;
  const totalImpactPct = (totalImpact/total)*100;

  const exportRows = impacted.map(r=>({Ticker:r.ticker,Sector:r.sector,CurrentValue:r.value.toFixed(2),StressedValue:r.newValue.toFixed(2),ImpactPct:r.impactPct.toFixed(2)+"%",DollarImpact:r.dollarImpact.toFixed(2)}));

  const scenarioLabel = custom.active ? `Custom (Rate ${sgn(custom.rate)}bps, Equity ${sgn(custom.equity)}%, FX ${sgn(custom.fx)}%)` : SCENARIOS.find(s=>s.id===selected)?.name;

  return (
    <div className="grid grid-cols-12 gap-2">
      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Pre-built Scenarios</div>
        <div className="p-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
          {SCENARIOS.map(s=>(
            <div key={s.id} onClick={()=>{ setSelected(s.id); setCustom(c=>({...c,active:false})); }}
              className={`border p-3 cursor-pointer ${selected===s.id && !custom.active ? "border-[#2dd4bf] bg-[#1c2128]" : "border-[#30363d] hover:border-[#484f58]"}`}>
              <div className="text-2xl mono" style={{color:s.color}}>{s.icon}</div>
              <div className="text-sm font-semibold mt-1">{s.name}</div>
              <div className="text-[10px] muted mt-1">{s.desc}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="col-span-12 lg:col-span-5 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Custom Scenario Builder</div>
        <div className="p-4 space-y-4">
          {[
            { k:"rate", label:"Rate Change (bps)", min:-200, max:200, step:5, suffix:"bps" },
            { k:"equity", label:"Equity Shock (%)", min:-50, max:50, step:1, suffix:"%" },
            { k:"fx", label:"FX Move (% USD)", min:-20, max:20, step:0.5, suffix:"%" },
          ].map(s=>(
            <div key={s.k}>
              <div className="flex items-center justify-between text-[11px]">
                <span className="muted uppercase tracking-wider">{s.label}</span>
                <span className={`mono ${custom[s.k]>=0?"pos":"neg"}`}>{sgn(custom[s.k])}{s.suffix}</span>
              </div>
              <input type="range" className="slider mt-2" min={s.min} max={s.max} step={s.step} value={custom[s.k]} onChange={e=>setCustom(c=>({...c, [s.k]:parseFloat(e.target.value), active:true }))} />
            </div>
          ))}
          <button onClick={()=>setCustom({active:false, rate:0, equity:0, fx:0})} className="mono text-[10px] uppercase tracking-widest muted hover:accent border border-[#30363d] hover:border-[#2dd4bf] px-2 py-1">Reset to Pre-built</button>
        </div>
      </div>

      <div className="col-span-12 lg:col-span-7 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Portfolio Value: Before vs After</div>
        <div className="p-4">
          <div className="text-[10px] muted uppercase mb-2">Scenario: <span className="accent">{scenarioLabel}</span></div>
          {(() => {
            const maxV = Math.max(total, newTotal);
            return (
              <div className="space-y-3 mt-3">
                <div>
                  <div className="flex justify-between text-[11px] mb-1"><span className="muted uppercase tracking-wider">Current</span><span className="mono">${fmt(total)}</span></div>
                  <div className="h-6 bg-[#0d1117] border border-[#21262d]"><div className="h-full" style={{width:(total/maxV*100)+"%", background:"#2dd4bf", opacity:0.7}}></div></div>
                </div>
                <div>
                  <div className="flex justify-between text-[11px] mb-1"><span className="muted uppercase tracking-wider">Stressed</span><span className={`mono ${totalImpact>=0?"pos":"neg"}`}>${fmt(newTotal)}</span></div>
                  <div className="h-6 bg-[#0d1117] border border-[#21262d]"><div className="h-full" style={{width:(newTotal/maxV*100)+"%", background: totalImpact>=0 ? "#22c55e" : "#ef4444", opacity:0.7}}></div></div>
                </div>
              </div>
            );
          })()}
          <div className="mt-4 grid grid-cols-3 gap-2 text-center">
            <div className="border border-[#21262d] p-2"><div className="text-[10px] muted uppercase">Dollar Impact</div><div className={`mono text-lg ${totalImpact>=0?"pos":"neg"}`}>${sgn(totalImpact)}</div></div>
            <div className="border border-[#21262d] p-2"><div className="text-[10px] muted uppercase">% Impact</div><div className={`mono text-lg ${totalImpact>=0?"pos":"neg"}`}>{sgnPct(totalImpactPct)}</div></div>
            <div className="border border-[#21262d] p-2"><div className="text-[10px] muted uppercase">VaR Multiple</div><div className="mono text-lg">{fmt(Math.abs(totalImpact)/42180,1)}x</div></div>
          </div>
        </div>
      </div>

      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-widest muted">Holding-Level Impact</div>
          <ExportBtn filename="stress_test.csv" rows={exportRows} />
        </div>
        <table className="w-full text-xs mono">
          <thead className="text-[10px] uppercase muted">
            <tr className="border-b border-[#21262d]">
              <th className="text-left px-3 py-1.5">Ticker</th>
              <th className="text-left px-3">Sector</th>
              <th className="text-right px-3">Current Value</th>
              <th className="text-right px-3">Stressed Value</th>
              <th className="text-right px-3">$ Impact</th>
              <th className="text-right px-3 pr-3">% Impact</th>
            </tr>
          </thead>
          <tbody>
            {impacted.map(r=>(
              <tr key={r.ticker} className="border-b border-[#21262d] hover:bg-[#1c2128] cursor-pointer" onClick={()=>navigate(r.ticker+" EQ")}>
                <td className="px-3 py-1.5 accent">{r.ticker}</td>
                <td className="px-3 muted">{r.sector}</td>
                <td className="px-3 text-right">${fmt(r.value)}</td>
                <td className={`px-3 text-right ${r.dollarImpact>=0?"pos":"neg"}`}>${fmt(r.newValue)}</td>
                <td className={`px-3 text-right ${r.dollarImpact>=0?"pos":"neg"}`}>${sgn(r.dollarImpact)}</td>
                <td className={`px-3 text-right pr-3 ${r.impactPct>=0?"pos":"neg"}`}>{sgnPct(r.impactPct)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const idx2Y = YIELD_CURVE.labels.indexOf("2Y");
  const idx10Y = YIELD_CURVE.labels.indexOf("10Y");
  const spread = YIELD_CURVE.today[idx10Y] - YIELD_CURVE.today[idx2Y];

                spread < -0.10 ? { name:"INVERTED", color:"#ef4444", desc:"Short rates exceed long rates — recession signal" } :
                { name:"FLAT", color:"#f59e0b", desc:"Curve is roughly flat — economic uncertainty" };

    <div className="grid grid-cols-12 gap-2">

          <div className="text-[11px] uppercase tracking-widest muted">US Treasury Yield Curve</div>

              { k:"today", label:"Today", color:"#2dd4bf" },

                <span>{s.label}</span>

          <MultiLineChart series={series} labels={YIELD_CURVE.labels} xValues={YIELD_CURVE.maturityYears} height={340} />
        </div>
      </div>

      <div className="col-span-12 lg:col-span-4 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Curve Shape Analysis</div>
        <div className="p-4">

const MCAP_TIERS = [
  { label:"All", min:0, max:Infinity },
  { label:"Small (<10B)", min:0, max:10 },
  { label:"Mid (10–100B)", min:10, max:100 },
  { label:"Large (100B–1T)", min:100, max:1000 },
  { label:"Mega (>1T)", min:1000, max:Infinity },
];

function ScreenerModule({ navigate }){
  const [mcapTier, setMcapTier] = useState(0);
  const [peRange, setPeRange] = useState([0,100]);
  const [sector, setSector] = useState("All");
  const [divRange, setDivRange] = useState([0,10]);
  const [wkRange, setWkRange] = useState([-50,100]);
  const [region, setRegion] = useState("All");
  const [sortKey, setSortKey] = useState("mcap");
  const [sortDir, setSortDir] = useState(-1);

  const filtered = useMemo(()=>{
    const tier = MCAP_TIERS[mcapTier];
    return Object.entries(EQUITIES).map(([k,v])=>({ticker:k, ...v})).filter(s=>{
      if(s.mcap<tier.min || s.mcap>=tier.max) return false;
      if(s.pe<peRange[0] || s.pe>peRange[1]) return false;
      if(sector!=="All" && s.sector!==sector) return false;
      if(s.divYield<divRange[0] || s.divYield>divRange[1]) return false;
      if(s.wkReturn<wkRange[0] || s.wkReturn>wkRange[1]) return false;
      if(region!=="All" && region!=="Global" && s.region!==region) return false;
      return true;
    });
  },[mcapTier,peRange,sector,divRange,wkRange,region]);

  const sorted = useMemo(()=>{
    return [...filtered].sort((a,b)=>{
      const av=a[sortKey], bv=b[sortKey];
      if(typeof av==="string") return sortDir*(av.localeCompare(bv));
      return sortDir*((av??0)-(bv??0));
    });
  },[filtered,sortKey,sortDir]);

  const sortBy = k => { if(sortKey===k) setSortDir(d=>-d); else { setSortKey(k); setSortDir(-1); } };

  const exportRows = sorted.map(r=>({Ticker:r.ticker,Name:r.name,Sector:r.sector,Region:r.region,MarketCap:r.mcapStr,PE:r.pe,DivYield:r.divYield,Return52W:r.wkReturn}));

  return (
    <div className="grid grid-cols-12 gap-2">
      <div className="col-span-12 lg:col-span-3 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Filters</div>
        <div className="p-4 space-y-5">
          <div>
            <div className="text-[10px] muted uppercase tracking-wider mb-2">Market Cap</div>
            <div className="flex flex-wrap gap-1">
              {MCAP_TIERS.map((t,i)=>(
                <span key={i} className={`chip mono ${mcapTier===i?"active":""}`} onClick={()=>setMcapTier(i)}>{t.label}</span>
              ))}
            </div>
          </div>
          <div>
            <div className="flex justify-between text-[10px] mb-1"><span className="muted uppercase tracking-wider">P/E Ratio</span><span className="mono">{peRange[0]} – {peRange[1]}</span></div>
            <input type="range" className="slider" min={0} max={100} value={peRange[0]} onChange={e=>setPeRange([parseInt(e.target.value), Math.max(peRange[1], parseInt(e.target.value))])} />
            <input type="range" className="slider mt-1" min={0} max={100} value={peRange[1]} onChange={e=>setPeRange([Math.min(peRange[0], parseInt(e.target.value)), parseInt(e.target.value)])} />
          </div>
          <div>
            <div className="text-[10px] muted uppercase tracking-wider mb-2">Sector</div>
            <select className="bare bg-[#0d1117] border border-[#30363d] mono text-xs px-2 py-1.5 w-full" value={sector} onChange={e=>setSector(e.target.value)}>
              <option>All</option>{SECTORS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <div className="flex justify-between text-[10px] mb-1"><span className="muted uppercase tracking-wider">Div Yield</span><span className="mono">{divRange[0]}% – {divRange[1]}%</span></div>
            <input type="range" className="slider" min={0} max={10} step={0.5} value={divRange[0]} onChange={e=>setDivRange([parseFloat(e.target.value), Math.max(divRange[1], parseFloat(e.target.value))])} />
            <input type="range" className="slider mt-1" min={0} max={10} step={0.5} value={divRange[1]} onChange={e=>setDivRange([Math.min(divRange[0], parseFloat(e.target.value)), parseFloat(e.target.value)])} />
          </div>
          <div>
            <div className="flex justify-between text-[10px] mb-1"><span className="muted uppercase tracking-wider">52W Return</span><span className="mono">{wkRange[0]}% – {wkRange[1]}%</span></div>
            <input type="range" className="slider" min={-50} max={100} value={wkRange[0]} onChange={e=>setWkRange([parseInt(e.target.value), Math.max(wkRange[1], parseInt(e.target.value))])} />
            <input type="range" className="slider mt-1" min={-50} max={100} value={wkRange[1]} onChange={e=>setWkRange([Math.min(wkRange[0], parseInt(e.target.value)), parseInt(e.target.value)])} />
          </div>
          <div>
            <div className="text-[10px] muted uppercase tracking-wider mb-2">Region</div>
            <select className="bare bg-[#0d1117] border border-[#30363d] mono text-xs px-2 py-1.5 w-full" value={region} onChange={e=>setRegion(e.target.value)}>
              <option>All</option>{REGIONS.map(r=><option key={r}>{r}</option>)}
            </select>
          </div>
          <button onClick={()=>{ setMcapTier(0); setPeRange([0,100]); setSector("All"); setDivRange([0,10]); setWkRange([-50,100]); setRegion("All"); }}
            className="mono text-[10px] uppercase tracking-widest muted hover:accent border border-[#30363d] hover:border-[#2dd4bf] px-2 py-1 w-full">Reset Filters</button>
        </div>
      </div>

      <div className="col-span-12 lg:col-span-9 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-widest muted">Results <span className="ml-2 accent mono">{sorted.length} matches</span></div>
          <ExportBtn filename="screener.csv" rows={exportRows} />
        </div>
        <table className="w-full text-xs mono">
          <thead className="text-[10px] uppercase muted">
            <tr className="border-b border-[#21262d]">
              {[["ticker","Ticker","left"],["name","Name","left"],["sector","Sector","left"],["region","Region","left"],["mcap","Mkt Cap","right"],["pe","P/E","right"],["divYield","Div %","right"],["wkReturn","52W %","right"]].map(([k,l,a])=>(
                <th key={k} className={`px-3 py-1.5 cursor-pointer hover:accent text-${a}`} onClick={()=>sortBy(k)}>{l} {sortKey===k?(sortDir>0?"▲":"▼"):""}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(r=>(
              <tr key={r.ticker} className="border-b border-[#21262d] hover:bg-[#1c2128] cursor-pointer" onClick={()=>navigate(r.ticker+" EQ")}>
                <td className="px-3 py-1.5 accent">{r.ticker}</td>
                <td className="px-3 truncate">{r.name}</td>
                <td className="px-3 muted">{r.sector}</td>
                <td className="px-3 muted">{r.region}</td>
                <td className="px-3 text-right">{r.mcapStr}</td>
                <td className="px-3 text-right">{fmt(r.pe,1)}</td>
                <td className="px-3 text-right">{fmt(r.divYield,2)}%</td>
                <td className={`px-3 text-right ${r.wkReturn>=0?"pos":"neg"}`}>{sgnPct(r.wkReturn)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ============== WATCHLIST ==============
function WatchlistModule({ watchlist, setWatchlist, alerts, setAlerts, triggered, navigate }){
  const [addTicker, setAddTicker] = useState("");
  const [alertModal, setAlertModal] = useState(null); // ticker
  const [draggingIdx, setDraggingIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);

  const handleAdd = () => {
    const t = addTicker.trim().toUpperCase();
    if(!t) return;
    if(!EQUITIES[t]){ alert("Unknown ticker: "+t); return; }
    if(watchlist.includes(t)) return;
    setWatchlist([...watchlist, t]);
    setAddTicker("");
  };

  const handleRemove = (t) => {
    setWatchlist(watchlist.filter(x=>x!==t));
    setAlerts(alerts.filter(a=>a.ticker!==t));
  };

  const onDragStart = (i) => setDraggingIdx(i);
  const onDragOver = (e,i) => { e.preventDefault(); setDragOverIdx(i); };
  const onDrop = (i) => {
    if(draggingIdx===null || draggingIdx===i) { setDraggingIdx(null); setDragOverIdx(null); return; }
    const next = [...watchlist];
    const [m] = next.splice(draggingIdx,1);
    next.splice(i,0,m);
    setWatchlist(next);
    setDraggingIdx(null); setDragOverIdx(null);
  };

  return (
    <div className="grid grid-cols-12 gap-2">
      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between">
          <div className="text-[11px] uppercase tracking-widest muted">Watchlist <span className="ml-2 mono accent">{watchlist.length} symbols</span></div>
          <form onSubmit={e=>{e.preventDefault(); handleAdd();}} className="flex gap-2">
            <input value={addTicker} onChange={e=>setAddTicker(e.target.value.toUpperCase())} placeholder="Add ticker..." className="bare bg-[#0d1117] border border-[#30363d] mono text-xs px-2 py-1 w-28" />
            <button className="mono text-[10px] uppercase tracking-widest accent border border-[#2dd4bf] px-2 hover:bg-[#2dd4bf]/10">+ Add</button>
          </form>
        </div>
        {watchlist.length===0 ? (
          <div className="p-8 text-center muted text-sm">No symbols. Add one above to get started.</div>
        ) : (
          <div>
            <div className="grid grid-cols-12 px-3 py-1.5 text-[10px] uppercase muted border-b border-[#21262d]">
              <div className="col-span-1"></div>
              <div className="col-span-1">Ticker</div>
              <div className="col-span-3">Name</div>
              <div className="col-span-2 text-right">Last</div>
              <div className="col-span-2 text-right">% Chg</div>
              <div className="col-span-1 text-right">Trend</div>
              <div className="col-span-2 text-right pr-3">Actions</div>
            </div>
            {watchlist.map((t,i)=>{
              const e = EQUITIES[t]; if(!e) return null;
              const trend = genSeries(e.price, 0.015, 30, t.charCodeAt(0));
              const tAlerts = alerts.filter(a=>a.ticker===t);
              const fired = tAlerts.filter(a=>triggered.includes(a.id));
              return (
                <div key={t} draggable
                  onDragStart={()=>onDragStart(i)}
                  onDragOver={e=>onDragOver(e,i)}
                  onDrop={()=>onDrop(i)}
                  onDragEnd={()=>{setDraggingIdx(null); setDragOverIdx(null);}}
                  className={`grid grid-cols-12 px-3 py-2 items-center border-b border-[#21262d] hover:bg-[#1c2128] ${dragOverIdx===i?"drag-over":""}`}>
                  <div className="col-span-1 muted cursor-move select-none">⋮⋮</div>
                  <div className="col-span-1 accent mono font-bold cursor-pointer" onClick={()=>navigate(t+" EQ")}>{t}</div>
                  <div className="col-span-3 text-xs truncate muted">{e.name}</div>
                  <div className="col-span-2 mono text-right">${fmt(e.price)}</div>
                  <div className={`col-span-2 mono text-right ${e.changePct>=0?"pos":"neg"}`}>{sgnPct(e.changePct)}</div>
                  <div className="col-span-1 text-right"><Sparkline data={trend} color={e.changePct>=0?"#2dd4bf":"#ef4444"} width={60} height={20} /></div>
                  <div className="col-span-2 text-right pr-3 flex items-center justify-end gap-2">
                    {fired.length>0 && <span className="mono text-[9px] px-1.5 py-0.5 border border-[#ef4444] text-[#ef4444] blink">⚠ ALERT</span>}
                    {tAlerts.length>0 && fired.length===0 && <span className="mono text-[9px] muted">{tAlerts.length} alert{tAlerts.length>1?"s":""}</span>}
                    <button onClick={()=>setAlertModal(t)} className="mono text-[10px] muted hover:accent border border-[#30363d] hover:border-[#2dd4bf] px-1.5 py-0.5">+ Alert</button>
                    <button onClick={()=>handleRemove(t)} className="mono text-[10px] muted hover:neg px-1">✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 text-[11px] uppercase tracking-widest muted">Active Alerts <span className="ml-2 mono accent">{alerts.length}</span></div>
        {alerts.length===0 ? (
          <div className="p-4 muted text-xs">No alerts set. Click <span className="mono accent">+ Alert</span> on a watchlist row to add one.</div>
        ) : (
          <table className="w-full text-xs mono">
            <thead className="text-[10px] uppercase muted"><tr className="border-b border-[#21262d]"><th className="text-left px-3 py-1.5">Ticker</th><th className="text-left px-3">Condition</th><th className="text-right px-3">Threshold</th><th className="text-right px-3">Current</th><th className="text-right px-3 pr-3">Status</th></tr></thead>
            <tbody>
              {alerts.map(a=>{
                const e = EQUITIES[a.ticker];
                const t = triggered.includes(a.id);
                return (
                  <tr key={a.id} className="border-b border-[#21262d]">
                    <td className="px-3 py-1.5 accent">{a.ticker}</td>
                    <td className="px-3 muted">Price {a.direction==="above"?"above":"below"}</td>
                    <td className="px-3 text-right">${fmt(a.threshold)}</td>
                    <td className="px-3 text-right">${fmt(e?.price||0)}</td>
                    <td className={`px-3 text-right pr-3 ${t?"neg":"muted"}`}>{t?"⚠ TRIGGERED":"Armed"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {alertModal && <AlertModal ticker={alertModal} onClose={()=>setAlertModal(null)} alerts={alerts} setAlerts={setAlerts} />}
    </div>
  );
}

function AlertModal({ ticker, onClose, alerts, setAlerts }){
  const e = EQUITIES[ticker];
  const [direction, setDirection] = useState("above");
  const [threshold, setThreshold] = useState(e?.price?.toFixed(2) || "0");
  const submit = () => {
    const v = parseFloat(threshold);
    if(isNaN(v)){ alert("Invalid threshold"); return; }
    setAlerts([...alerts, { id: Date.now()+"-"+ticker, ticker, direction, threshold:v }]);
    onClose();
  };
  return (
    <Modal title={`Add Alert — ${ticker}`} onClose={onClose} maxWidth="max-w-md">
      <div className="space-y-4">
        <div>
          <div className="text-[10px] muted uppercase tracking-wider mb-1">Current Price</div>
          <div className="mono text-xl">${fmt(e?.price||0)}</div>
        </div>
        <div>
          <div className="text-[10px] muted uppercase tracking-wider mb-2">Trigger when price is</div>
          <div className="flex gap-2">
            <button onClick={()=>setDirection("above")} className={`flex-1 mono text-xs uppercase py-2 border ${direction==="above"?"accent border-[#2dd4bf]":"muted border-[#30363d]"}`}>Above</button>
            <button onClick={()=>setDirection("below")} className={`flex-1 mono text-xs uppercase py-2 border ${direction==="below"?"accent border-[#2dd4bf]":"muted border-[#30363d]"}`}>Below</button>
          </div>
        </div>
        <div>
          <div className="text-[10px] muted uppercase tracking-wider mb-2">Threshold ($)</div>
          <input value={threshold} onChange={e=>setThreshold(e.target.value)} className="bare bg-[#0d1117] border border-[#30363d] mono text-sm px-3 py-2 w-full" />
        </div>
        <div className="flex gap-2 justify-end pt-2">
          <button onClick={onClose} className="mono text-xs uppercase muted px-3 py-2 border border-[#30363d]">Cancel</button>
          <button onClick={submit} className="mono text-xs uppercase accent border border-[#2dd4bf] px-4 py-2 hover:bg-[#2dd4bf]/10">Create Alert</button>
        </div>
      </div>
    </Modal>
  );
}

const ASKB_PROMPTS = [
  "Summarize the macro outlook",

  "Explain the current yield curve shape",

];

function mockAskBResponse(prompt){
  const p = prompt.toLowerCase();
  if(p.includes("macro")){
    return {
      text:`The macro backdrop is mixed but tilting constructive. US GDP expanded at a 2.8% annualized pace last quarter (above consensus), while core CPI has decelerated to 3.2% YoY from 3.5% the prior month. Unemployment ticked up to 4.1%, consistent with the Fed's soft-landing narrative.\n\nThe FOMC cut the policy rate 25bps to a 4.50–4.75% range, with markets pricing two more cuts by year-end. The 10Y UST is bid at 4.28%, leaving the 2s10s at -4bps — still mildly inverted but rapidly steepening.\n\nKey risks: sticky services inflation, oil supply disruptions (Brent $78), and a strengthening USD weighing on multinational EPS. Watch the next PCE print and the Q4 earnings cycle.`,
      bql:`SHOW indicators WHERE category = 'macro' AND region = 'US'`
    };
  }
  if(p.includes("risk") || p.includes("holding")){
    return {
      text:`Your portfolio's largest standalone risk contributor is NVDA, accounting for ~24.8% of total risk despite a 18% portfolio weight. This is driven by elevated single-name volatility (σ ≈ 30%) and concentrated semiconductor exposure.\n\nSector concentration in Technology (≈ 58% NAV) is the dominant factor — a single sector shock dominates idiosyncratic risk. Portfolio beta vs S&P 500 is 1.18, with a moderate Growth/Momentum tilt (+0.82 / +0.58 z-scores).\n\nRecommendations: trim NVDA on strength toward a 12% target, add a defensive ballast (XLV or low-vol staples), and consider a covered-call overlay on AAPL and MSFT to harvest premium.`,
      bql:`SHOW portfolio.holdings ORDER BY risk_contribution DESC LIMIT 5`
    };
  }
  if(p.includes("yield") || p.includes("curve")){
    return {
      text:`The US Treasury curve is currently mildly inverted at the front end and bull-steepening from a year ago. Today's 2s10s sits at -4bps vs -47bps one year ago — a ~43bps re-steepening, consistent with the start of an easing cycle.\n\nThe front end (1M–6M) remains anchored to the Fed Funds rate at ~4.78%, while the belly (5Y–10Y) trades 4.28–4.42% as the market discounts further policy normalization. The 30Y at 4.62% reflects modestly higher term premium.\n\nHistorically, the period following 2s10s un-inversion has been positive for risk assets in the near term but coincides with elevated recession probabilities at 6–12 months out. Stay long duration (5Y–10Y) and overweight quality credit.`,
      bql:`SHOW ust_curve WHERE date IN ('today','1y_ago')`
    };
  }
  if(p.includes("screen") || p.includes("undervalued")){
    return {
      text:`Below is a screen for large-cap Technology stocks trading at a reasonable valuation. Filters applied: P/E < 30, Market Cap > $500B, 52W return positive (momentum filter).\n\nThe screen surfaces names like GOOGL (P/E 25.9, +30% LTM) and META (P/E 28.4, +55% LTM) — both showing earnings growth materially outpacing multiple expansion. AAPL screens slightly rich at 34.8x but earns a quality premium.\n\nAvoid: NVDA at 67x trailing — strong fundamentals but priced for perfection. Consider waiting for a 10–15% drawdown to add.`,
      bql:`SHOW stocks WHERE sector = 'Technology' AND market_cap > 500B AND pe_ratio < 30 AND wk_return > 0`
    };
  }
  return {
    text:`I can help with portfolio analysis, macro context, security research, and screening. Try one of the suggested prompts or ask a more specific question — e.g. "What's the impact of a 100bps rate hike on my portfolio?" or "Compare AAPL vs MSFT on valuation."`,
    bql:null
  };
}

    { role:"system", text:"ASKB — Bloomberg AI Assistant. Ask anything about markets, your portfolio, or screening." }
  ]);
  const [input, setInput] = useState("");

function EconModule(){
  const [view, setView] = useState("week");
  const [anchor, setAnchor] = useState(todayISO());
  const [catFilter, setCatFilter] = useState({});
  const [impFilter, setImpFilter] = useState({});
  const [detail, setDetail] = useState(null);
  const allCats = Array.from(new Set(ECON_EVENTS.map(e=>e.category)));
  const isCatOn = (c)=> catFilter[c] !== false;
  const isImpOn = (i)=> impFilter[i] !== false;
  const filtered = ECON_EVENTS.filter(e=>isCatOn(e.category) && isImpOn(e.importance));
  const ws = weekStart(anchor);
  const days = view==="week" ? Array.from({length:5},(_,i)=>addDays(ws,i)) : Array.from({length:28},(_,i)=>addDays(ws,i));
  const eventsByDay = days.map(d=>({ date:d, events: filtered.filter(e=>e.date===d) }));
  const upcoming = nextHighImportanceEvents(7);

  return (
    <div className="grid grid-cols-12 gap-2">
      <div className="col-span-12 panel">
        <div className="panel-header px-3 py-1.5 flex items-center justify-between flex-wrap gap-2">
          <div className="text-[11px] uppercase tracking-widest muted">Economic Calendar</div>
          <div className="flex items-center gap-2">
            <button onClick={()=>setAnchor(addDays(anchor, view==="week"?-7:-28))} className="muted hover:accent text-xs px-2">‹</button>
            <div className="mono text-[10px] muted">{view==="week"?"Week of":"From"} {dateLabel(weekStart(anchor))}</div>
            <button onClick={()=>setAnchor(addDays(anchor, view==="week"?7:28))} className="muted hover:accent text-xs px-2">›</button>
            <div className="flex border border-[#30363d] rounded-sm overflow-hidden ml-2">
              <button onClick={()=>setView("week")}  className={`mono text-[10px] uppercase px-2 py-0.5 ${view==="week"?"accent-bg text-[#0d1117]":"muted"}`}>Week</button>
              <button onClick={()=>setView("month")} className={`mono text-[10px] uppercase px-2 py-0.5 ${view==="month"?"accent-bg text-[#0d1117]":"muted"}`}>Month</button>
            </div>
          </div>
        </div>
        <div className="p-3 flex flex-wrap gap-x-4 gap-y-2 text-[11px]">
          <div className="flex items-center gap-1.5 mr-2">
            <span className="muted uppercase tracking-widest text-[10px]">Importance:</span>
            {["High","Medium","Low"].map(i=>(
              <span key={i} onClick={()=>setImpFilter(f=>({...f, [i]:!isImpOn(i)}))}
                className={`chip mono ${isImpOn(i)?"active":""}`} style={isImpOn(i)?{borderColor:IMPORTANCE_COLORS[i], color:IMPORTANCE_COLORS[i]}:{}}>{i}</span>
            ))}
          </div>
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="muted uppercase tracking-widest text-[10px]">Category:</span>
            {allCats.map(c=>(
              <span key={c} onClick={()=>setCatFilter(f=>({...f, [c]:!isCatOn(c)}))}
                className={`chip mono ${isCatOn(c)?"active":""}`} style={isCatOn(c)?{borderColor:CATEGORY_COLORS[c], color:CATEGORY_COLORS[c]}:{}}>{c}</span>
            ))}
          </div>
        </div>
      </div>

      <div className="col-span-12 lg:col-span-9 panel">
        <div className={`grid ${view==="week"?"grid-cols-5":"grid-cols-7"} divide-x divide-[#21262d]`}>
          {eventsByDay.map(({date,events})=>{
            const isToday = date===todayISO();
            return (
              <div key={date} className="min-h-[420px] flex flex-col">
                <div className={`px-2 py-1.5 border-b border-[#21262d] text-center ${isToday?"bg-[#1c2128]":""}`}>
                  <div className="text-[10px] muted uppercase tracking-widest">{dateLabel(date).split(",")[0]}</div>
                  <div className={`mono text-sm ${isToday?"accent font-bold":""}`}>{date.slice(5)}</div>

                <div className="flex-1 p-2 space-y-2">

                    <div key={i} onClick={()=>setDetail(e)} className="border border-[#21262d] p-2 cursor-pointer hover:border-[#2dd4bf] bg-[#0d1117]">
                      <div className="flex items-center justify-between mb-1">
                        <div className="mono text-[10px] muted">{e.time}</div>
                        <span className="mono text-[9px] uppercase px-1.5 rounded-sm border" style={{color:IMPORTANCE_COLORS[e.importance], borderColor:IMPORTANCE_COLORS[e.importance]}}>{e.importance}</span>

                      <div className="mt-1 text-[10px] mono flex items-center justify-between gap-1">

        <div className="divide-y divide-[#21262d]">
          {upcoming.map((e,i)=>(

                <span className="mono text-[9px] uppercase px-1.5 rounded-sm border" style={{color:CATEGORY_COLORS[e.category], borderColor:CATEGORY_COLORS[e.category]+"66"}}>{e.category}</span>

}

function FeedConfigCard({ feed, fs, onChangeKey, onTest, onDisconnect }){

        <button onClick={()=>onTest(feed.id)} disabled={fs.state==="testing"}
          className="mono text-[10px] uppercase tracking-widest accent border border-[#2dd4bf] px-3 hover:bg-[#2dd4bf]/10 disabled:opacity-40 whitespace-nowrap">
          {fs.state==="testing"?"Testing…":"Test & Connect"}

              <span key={a.name}>
                {i>0 && <span className="mx-1">·</span>}

function CommandBar({ onSubmit, history }){
  const [val, setVal] = useState("");
  const [histIdx, setHistIdx] = useState(-1);
  const inputRef = useRef(null);
  useEffect(()=>{
    const h = e => { if(e.key==="/" && document.activeElement!==inputRef.current && document.activeElement?.tagName!=="INPUT" && document.activeElement?.tagName!=="TEXTAREA"){ e.preventDefault(); inputRef.current?.focus(); } };
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown",h);
  },[]);

  const onKey = e => {
    if(e.key==="ArrowUp"){
      e.preventDefault();
      if(history.length===0) return;
      const ni = histIdx<0 ? history.length-1 : Math.max(0, histIdx-1);
      setHistIdx(ni); setVal(history[ni]);
    } else if(e.key==="ArrowDown"){
      e.preventDefault();
      if(histIdx<0) return;
      const ni = histIdx+1;
      if(ni>=history.length){ setHistIdx(-1); setVal(""); }
      else { setHistIdx(ni); setVal(history[ni]); }
    }
  };

  const submit = e => {
    e.preventDefault();
    if(!val.trim()) return;
    onSubmit(val.trim());
    setVal(""); setHistIdx(-1);
  };
  return (
    <div className="border-t border-[#21262d] bg-[#0d1117]">
      <div className="px-3 py-1 text-[10px] muted flex items-center gap-4 border-b border-[#21262d] flex-wrap">
        <span className="uppercase tracking-widest">Examples:</span>
        {["AAPL EQ","AAPL FA","MACRO","FXC","NEWS","PORT","BQL","RISK","STRESS","YCRV","EQS","WATCH","ASKB","COMP","ECO","CONN","MENU","HELP"].map(c=>(
          <span key={c} className="mono"><span className="accent cursor-pointer hover:underline" onClick={()=>onSubmit(c)}>{c}</span> &lt;GO&gt;</span>
        ))}
        <span className="ml-auto">Press <kbd className="px-1 border border-[#30363d] rounded-sm">/</kbd> focus · <kbd className="px-1 border border-[#30363d] rounded-sm">↑/↓</kbd> history · <kbd className="px-1 border border-[#30363d] rounded-sm">Enter</kbd> exec</span>
      </div>
      <form onSubmit={submit} className="flex items-center px-3 py-2 gap-2">
        <span className="accent mono text-sm">▍</span>
        <span className="muted mono text-xs">CMD&gt;</span>
        <input ref={inputRef} value={val} onChange={e=>setVal(e.target.value.toUpperCase())} onKeyDown={onKey}
          className="cmd flex-1 bg-transparent mono text-sm placeholder-[#484f58] caret-[#2dd4bf]"
          placeholder="Type a command, e.g. NVDA EQ <GO>  ·  HELP <GO>  ·  MENU <GO>" autoFocus />
        <button type="submit" className="mono text-[10px] uppercase tracking-widest accent border border-[#2dd4bf] px-2 py-0.5 hover:bg-[#2dd4bf]/10">Go</button>
      </form>
    </div>
  );
}

// Color-coded signal dots
function signal(metric, value){
  const v = parseFloat(value);
  switch(metric){
    case "pe":
      if(v<=0||v>50) return { color:"#ef4444", tip:"Outside normal range — either no profits or very expensive" };
      if(v<20)  return { color:"#22c55e", tip:"Reasonably priced relative to earnings" };
      if(v<35)  return { color:"#facc15", tip:"Moderately expensive — paying a premium for growth" };
      return       { color:"#ef4444", tip:"Expensive — priced for strong future growth" };
    case "divYield":
      if(v>=2)  return { color:"#22c55e", tip:"Healthy income payout" };
      if(v>=0.5)return { color:"#facc15", tip:"Modest payout" };
      return       { color:"#ef4444", tip:"Little or no income for shareholders" };
    case "changePct":
      if(v>0.5) return { color:"#22c55e", tip:"Trading up today" };
      if(v>-0.5)return { color:"#facc15", tip:"Roughly flat today" };
      return       { color:"#ef4444", tip:"Trading down today" };
    case "vol":
      if(v<15)  return { color:"#22c55e", tip:"Calm, low-volatility holding" };
      if(v<25)  return { color:"#facc15", tip:"Normal market volatility" };
      return       { color:"#ef4444", tip:"Bumpy — wide price swings" };
    case "beta":
      if(v>=0.8&&v<=1.2) return { color:"#22c55e", tip:"Moves roughly with the market" };
      if(v<0.8) return { color:"#facc15", tip:"Less reactive than the market" };
      return       { color:"#ef4444", tip:"Amplifies market moves — higher risk" };
    case "sharpe":
      if(v>=1)  return { color:"#22c55e", tip:"Strong return per unit of risk" };
      if(v>=0.5)return { color:"#facc15", tip:"Modest return for the risk taken" };
      return       { color:"#ef4444", tip:"Poor compensation for risk" };
    case "maxDD":
      if(v>-15) return { color:"#22c55e", tip:"Manageable historical losses" };
      if(v>-25) return { color:"#facc15", tip:"Has seen meaningful drawdowns" };
      return       { color:"#ef4444", tip:"Large historical losses — be ready for big swings" };
    case "var":
      if(v>-30000) return { color:"#22c55e", tip:"Daily downside loss is contained" };
      if(v>-60000) return { color:"#facc15", tip:"Moderate daily downside risk" };
      return       { color:"#ef4444", tip:"Large potential daily loss" };
    default: return null;
  }
}

// Natural-language → command router
function nlRoute(text){
  const t = text.toLowerCase().trim();
  if(!t) return null;
  // ticker lookup by symbol or company name
  for(const [k,v] of Object.entries(EQUITIES)){
    if(t.includes(k.toLowerCase())) return k+" EQ";
    const firstWord = v.name.toLowerCase().split(/[ .,]/)[0];
    if(firstWord.length>2 && t.includes(firstWord)) return k+" EQ";
  }
  if(/economy|gdp|inflation|unemploy|macro/.test(t)) return "MACRO";
  if(/yield|interest rate|treasury|10y|curve/.test(t)) return "YCRV";
  if(/portfolio|holdings|my stocks|my position/.test(t)) return "PORT";
  if(/screen|filter|find stock|cheap|undervalued|hidden gem/.test(t)) return "SCRN";
  if(/crash|stress|scenario|what if|simulate/.test(t)) return "STRESS";
  if(/risk|drawdown|volatil|beta|sharpe/.test(t)) return "RISK";
  if(/news|headline/.test(t)) return "NEWS";
  if(/watch|alert|monitor/.test(t)) return "WATCH";
  if(/currency|exchange|fx|forex|dollar|euro/.test(t)) return "FX";
  if(/query|bql|sql|database/.test(t)) return "BQL";
  if(/compare|comparison|\bvs\b|versus|side[- ]by[- ]side/.test(t)) return "COMP";
  if(/calendar|economic event|cpi release|fed meeting|jobs report|earnings calendar|release|upcoming/.test(t)) return "ECON";
  if(/\bapi\b|connect|data feed|data source|api key|setup data|update.*key/.test(t)) return "CONN";
  if(/ask|chat|analyst|explain/.test(t)) return "ASKB";
  if(/home|menu|main/.test(t)) return "MENU";
  return null;
}

// Context-aware AI drawer (Simple Mode)
function aiStartersFor(view){
  switch(view.mod){
    case "EQ": return ["Is this stock a good buy?","Explain the P/E ratio for me","What do analysts think?","How has this stock performed vs. the market?"];
    case "PORT": return ["How is my portfolio doing?","Which holding is riskiest?","Am I too concentrated in tech?","Should I rebalance?"];
    case "MACRO": return ["Summarize the macro outlook","What does rising inflation mean for me?","Are we heading into a recession?","Will rates keep falling?"];
    case "YCRV": return ["Explain the current yield curve shape","What does an inverted curve mean?","How do rates affect my portfolio?","Should I buy bonds now?"];
    case "FX": return ["Why is the dollar strong?","Best currency to hold right now?","How does FX affect my stocks?","What moves currency pairs?"];
    case "RISK": return ["Is my portfolio risky?","Explain VaR in plain English","What is a good Sharpe ratio?","How do I reduce risk?"];
    case "STRESS": return ["What if rates jump 100bps?","What if the market crashes 30%?","How would a recession hit me?","Which holding is most exposed?"];
    case "SCRN": return ["Find cheap large-cap tech stocks","Show me high-dividend stocks","Stocks with strong momentum","International stocks worth a look"];
    case "NEWS": return ["What's the most important story?","Anything on my portfolio?","Top earnings stories today","Macro news that matters"];
    case "WATCH": return ["Set an alert on AAPL","Why is NVDA on watchlists?","Best practices for alerts","Should I buy what I'm watching?"];
    case "COMP": return ["Which compared stock is best?","Explain why one outperformed","What metric matters most here?","Suggest a peer to add"];
    case "ECON": return ["Which upcoming event matters most?","Explain the CPI release","How will the Fed decision move stocks?","What is non-farm payrolls?"];
    default: return ["Summarize the macro outlook","Which of my holdings has the most risk?","Find undervalued large-cap tech stocks","Explain the current yield curve shape"];
  }
}

function SimpleAIDrawer({ view, navigate }){
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [collapsed, setCollapsed] = useState(false);
  const endRef = useRef(null);
  const starters = aiStartersFor(view);

  useEffect(()=>{ setMessages([]); },[view.mod, view.ticker]);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[messages]);

  const send = (text) => {
    const q = text.trim(); if(!q) return;
    const res = mockAskBResponse(q);
    setMessages(m=>[...m, {role:"user",text:q}, {role:"assistant",text:res.text,bql:res.bql}]);
    setInput("");
  };

  if(collapsed) return (
    <button onClick={()=>setCollapsed(false)} className="fixed right-3 bottom-3 panel px-3 py-2 mono text-[11px] uppercase tracking-widest accent border-[#2dd4bf] z-30">💬 Ask AI</button>
  );

  return (
    <div className="w-[340px] shrink-0 border-l border-[#21262d] bg-[#0d1117] flex flex-col h-full">
      <div className="panel-header px-3 py-2 flex items-center justify-between">
        <div className="text-[11px] uppercase tracking-widest muted flex items-center gap-2">
          <span className="w-1.5 h-1.5 rounded-full bg-[#2dd4bf]"></span>
          AI Assistant
        </div>
        <button onClick={()=>setCollapsed(true)} className="muted hover:accent text-sm" title="Collapse">−</button>
      </div>
      <div className="flex-1 overflow-y-auto p-3 space-y-3">
        {messages.length===0 ? (
          <div>
            <div className="text-xs muted mb-3">Try one of these about <span className="accent">{view.mod==="EQ"?view.ticker:view.mod.toLowerCase()}</span>:</div>
            <div className="space-y-2">
              {starters.map(p=>(
                <div key={p} onClick={()=>send(p)} className="text-xs panel p-2.5 cursor-pointer hover:border-[#2dd4bf]">{p}</div>
              ))}
            </div>
          </div>
        ) : messages.map((m,i)=>(
          m.role==="user" ? (
            <div key={i} className="flex justify-end">
              <div className="max-w-[85%] bg-[#1c2128] border border-[#30363d] rounded-sm px-2.5 py-1.5 text-xs">{m.text}</div>
            </div>
          ) : (
            <div key={i} className="text-xs">
              <div className="text-[9px] mono uppercase tracking-widest accent mb-1">ASKB</div>
              <div className="whitespace-pre-line leading-relaxed">{m.text}</div>
              {m.bql && <div className="mt-2 border-l-2 border-[#30363d] bg-[#161b22] p-1.5 mono text-[10px] muted">{m.bql}</div>}
            </div>
          )
        ))}
        <div ref={endRef}></div>
      </div>
      <form onSubmit={e=>{e.preventDefault(); send(input);}} className="border-t border-[#21262d] p-2 flex gap-1">
        <input value={input} onChange={e=>setInput(e.target.value)} placeholder="Ask anything..."
          className="bare flex-1 bg-[#161b22] border border-[#30363d] mono text-xs px-2 py-1.5 caret-[#2dd4bf]" />
        <button className="mono text-[10px] uppercase tracking-widest accent border border-[#2dd4bf] px-2 hover:bg-[#2dd4bf]/10">Go</button>
      </form>
    </div>
  );
}

function SimpleYCRVModule(){
  const [visible, setVisible] = useState({today:true, oneYear:true, twoYear:false});
  const series = [];
  if(visible.today) series.push({data:YIELD_CURVE.today, color:"#2dd4bf", label:"Today"});
  if(visible.oneYear) series.push({data:YIELD_CURVE.oneYear, color:"#f59e0b", label:"1 Year Ago"});
  if(visible.twoYear) series.push({data:YIELD_CURVE.twoYear, color:"#a78bfa", label:"2 Years Ago"});

  const idx2Y = YIELD_CURVE.labels.indexOf("2Y");
  const idx10Y = YIELD_CURVE.labels.indexOf("10Y");
  const idx30Y = YIELD_CURVE.labels.indexOf("30Y");
  const spread = YIELD_CURVE.today[idx10Y] - YIELD_CURVE.today[idx2Y];
  const isNormal = spread > 0.25;
  const isInverted = spread < -0.1;

  const banner = isInverted
    ? { color:"#ef4444", icon:"⚠️", title:"Inverted Curve — Recession warning signal", desc:"Short-term rates are higher than long-term rates. Historically, this has often (but not always) preceded recessions. Markets tend to get cautious here." }
    : isNormal
    ? { color:"#22c55e", icon:"✅", title:"Normal Curve — Economy appears healthy", desc:"Long-term rates are higher than short-term rates, which is the usual healthy shape. Lenders demand more for tying up money longer." }
    : { color:"#facc15", icon:"⚖️", title:"Flat Curve — Economy at a turning point", desc:"Short and long rates are similar. The bond market is unsure whether growth speeds up or slows down from here." };

  return (
    <div className="space-y-3 max-w-6xl mx-auto">
      <div className="panel p-5" style={{borderColor:banner.color}}>
        <div className="flex items-start gap-4">
          <div className="text-3xl">{banner.icon}</div>
          <div>
            <div className="text-lg font-bold" style={{color:banner.color}}>{banner.title}</div>
            <div className="text-sm muted mt-2 leading-relaxed">{banner.desc}</div>
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-header px-3 py-2 flex items-center justify-between flex-wrap gap-2">
          <div className="text-xs uppercase tracking-widest muted">Government Bond Rates by Maturity</div>
          <div className="flex items-center gap-3 text-[10px]">
            {[{k:"today",l:"Today",c:"#2dd4bf"},{k:"oneYear",l:"1Y Ago",c:"#f59e0b"},{k:"twoYear",l:"2Y Ago",c:"#a78bfa"}].map(s=>(
              <label key={s.k} className="flex items-center gap-1.5 mono cursor-pointer">
                <input type="checkbox" checked={visible[s.k]} onChange={e=>setVisible(v=>({...v,[s.k]:e.target.checked}))} />
                <span className="w-3 h-0.5 inline-block" style={{background:s.c}}></span>
                <span>{s.l}</span>
              </label>
            ))}
          </div>
        </div>
        <div className="p-4 grid-bg">
          <MultiLineChart series={series} labels={YIELD_CURVE.labels} xValues={YIELD_CURVE.maturityYears} height={300} />
        </div>
        <div className="px-4 pb-4 text-[12px] muted">
          The line shows what investors earn lending money to the US government for different lengths of time, from 1 month to 30 years.
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <MetricCard label="2-Year vs 10-Year Gap" value={sgn(spread*100)+" bps"} valueClass={spread>=0?"pos":"neg"} explainer="The gap between short and long rates — negative means inverted" />
        <MetricCard label="10-Year Bond Rate" value={fmt(YIELD_CURVE.today[idx10Y])+"%"} explainer="What the US pays to borrow for 10 years — drives mortgages" />
        <MetricCard label="2-Year Bond Rate" value={fmt(YIELD_CURVE.today[idx2Y])+"%"} explainer="Reflects expectations for Fed policy in the next 2 years" />
        <MetricCard label="30-Year Bond Rate" value={fmt(YIELD_CURVE.today[idx30Y])+"%"} explainer="Long-term rate — used to price the longest mortgages" />
      </div>
    </div>
  );
}
