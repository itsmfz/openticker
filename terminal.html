  const SIZE_BUCKETS = [
    {label:"Any size", min:0, max:Infinity},
    {label:"Small (<10B)", min:0, max:10},
    {label:"Mid (10B–100B)", min:10, max:100},
    {label:"Large (100B–1T)", min:100, max:1000},
    {label:"Mega (>1T)", min:1000, max:Infinity},
  ];
  const [asset, setAsset] = useState("stocks");
  const [sector, setSector] = useState("All");
  const [size, setSize] = useState(0);
  const [peRange, setPeRange] = useState([0,100]);
  const [div, setDiv] = useState("Any");
  const [perfRange, setPerfRange] = useState([-50,100]);

  const results = useMemo(()=>{
    const sz = SIZE_BUCKETS[size];
    if(asset==="bonds") return BONDS;
    let dataset = asset==="portfolio"
      ? buildPortfolioRows().map(r=>({...EQUITIES[r.ticker], ticker:r.ticker}))
      : Object.entries(EQUITIES).map(([k,v])=>({ticker:k, ...v}));
    return dataset.filter(s=>{
      if(s.mcap<sz.min || s.mcap>=sz.max) return false;
      if(sector!=="All" && s.sector!==sector) return false;
      if(s.pe<peRange[0] || s.pe>peRange[1]) return false;
      if(div==="None"   && s.divYield>0.1) return false;
      if(div==="Low"    && (s.divYield<0.1 || s.divYield>=2)) return false;
      if(div==="Medium" && (s.divYield<2   || s.divYield>=4)) return false;
      if(div==="High"   && s.divYield<4) return false;
      if(s.wkReturn<perfRange[0] || s.wkReturn>perfRange[1]) return false;
      return true;
    });
  },[asset, sector, size, peRange, div, perfRange]);

  const queryParts = [];
  if(asset!=="portfolio" && sector!=="All") queryParts.push(`sector = '${sector}'`);
  if(size>0) queryParts.push(`market_cap BETWEEN ${SIZE_BUCKETS[size].min}B AND ${SIZE_BUCKETS[size].max===Infinity?"∞":SIZE_BUCKETS[size].max+"B"}`);
  queryParts.push(`pe_ratio BETWEEN ${peRange[0]} AND ${peRange[1]}`);
  if(div!=="Any") queryParts.push(`dividend = '${div}'`);
  queryParts.push(`wk_return BETWEEN ${perfRange[0]}% AND ${perfRange[1]}%`);
  const queryStr = `SHOW ${asset}${asset==="bonds"?"":(" WHERE "+queryParts.join(" AND "))}`;

  const exportRows = results.map(r=>({Ticker:r.ticker,Name:r.name,Sector:r.sector,Price:r.price,PE:r.pe,DivYield:r.divYield,Return:r.wkReturn}));

  return (
    <div className="space-y-3 max-w-6xl mx-auto">
      <div className="panel p-5">
        <div className="text-lg font-semibold mb-1">Find Stocks</div>
        <div className="text-sm muted mb-5">Adjust the filters below to find investments matching what you're looking for.</div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <div className="text-[11px] muted uppercase tracking-wider mb-2">Asset Type</div>
            <select className="bare bg-[#0d1117] border border-[#30363d] text-sm px-3 py-2 w-full" value={asset} onChange={e=>setAsset(e.target.value)}>
              <option value="stocks">Stocks</option>
              <option value="bonds">Bonds</option>
              <option value="portfolio">My Portfolio</option>
            </select>
          </div>
          <div>
            <div className="text-[11px] muted uppercase tracking-wider mb-2">Industry</div>
            <select className="bare bg-[#0d1117] border border-[#30363d] text-sm px-3 py-2 w-full" value={sector} onChange={e=>setSector(e.target.value)} disabled={asset==="bonds"}>
              <option>All</option>{SECTORS.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>

          <div>
            <div className="flex justify-between text-[11px] mb-2"><span className="muted uppercase tracking-wider">Company Size</span><span className="mono text-xs">{SIZE_BUCKETS[size].label}</span></div>
            <input type="range" className="slider" min={0} max={4} value={size} onChange={e=>setSize(parseInt(e.target.value))} />
            <div className="flex justify-between text-[9px] muted mt-1"><span>Any</span><span>Small</span><span>Mid</span><span>Large</span><span>Mega</span></div>
          </div>

          <div>
            <div className="text-[11px] muted uppercase tracking-wider mb-2">Dividend Payout</div>
            <div className="flex flex-wrap gap-2">
              {["Any","None","Low","Medium","High"].map(d=>(
                <span key={d} className={`chip mono ${div===d?"active":""}`} onClick={()=>setDiv(d)}>{d}</span>
              ))}
            </div>
          </div>

          <div className="md:col-span-2">
            <div className="flex justify-between text-[11px] mb-2"><span className="muted uppercase tracking-wider">Price Score (P/E)</span><span className="mono text-xs">{peRange[0]} – {peRange[1]}</span></div>
            <input type="range" className="slider" min={0} max={100} value={peRange[0]} onChange={e=>setPeRange([parseInt(e.target.value), Math.max(peRange[1], parseInt(e.target.value))])} />
            <input type="range" className="slider mt-2" min={0} max={100} value={peRange[1]} onChange={e=>setPeRange([Math.min(peRange[0], parseInt(e.target.value)), parseInt(e.target.value)])} />
            <div className="flex justify-between text-[10px] muted mt-1"><span>← Cheap</span><span>Expensive →</span></div>
          </div>

          <div className="md:col-span-2">
            <div className="flex justify-between text-[11px] mb-2"><span className="muted uppercase tracking-wider">Performance This Year</span><span className="mono text-xs">{perfRange[0]}% – {perfRange[1]}%</span></div>
            <input type="range" className="slider" min={-50} max={100} value={perfRange[0]} onChange={e=>setPerfRange([parseInt(e.target.value), Math.max(perfRange[1], parseInt(e.target.value))])} />
            <input type="range" className="slider mt-2" min={-50} max={100} value={perfRange[1]} onChange={e=>setPerfRange([Math.min(perfRange[0], parseInt(e.target.value)), parseInt(e.target.value)])} />
          </div>
        </div>

        <div className="mt-5 p-3 bg-[#0d1117] border border-[#21262d] mono text-[10px] muted">
          <span className="accent uppercase tracking-widest text-[9px] mr-2">Behind the scenes:</span>{queryStr}
        </div>
      </div>

      <div className="panel">
        <div className="panel-header px-3 py-2 flex items-center justify-between">
          <div className="text-xs uppercase tracking-widest muted">Matches <span className="ml-2 accent mono">{results.length}</span></div>
          {results.length>0 && <ExportBtn filename="finder_results.csv" rows={exportRows} />}
        </div>
        <div className="p-4">
          {results.length===0 ? (
            <div className="text-sm muted text-center py-8">No matches. Try widening your filters.</div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {results.map(r=>(
                <div key={r.ticker} className="panel p-4 cursor-pointer hover:border-[#2dd4bf]" onClick={()=>asset!=="bonds" && navigate(r.ticker+" EQ")}>
                  <div className="flex items-start justify-between mb-2">
                    <div>
                      <div className="text-sm font-semibold leading-tight">{r.name}</div>
                      <div className="text-xs accent mono mt-0.5">{r.ticker}</div>
                    </div>
                    {r.wkReturn!=null && (
                      <span className={`mono text-[10px] px-2 py-0.5 rounded-sm border ${r.wkReturn>=0?"pos border-[#22c55e]/50":"neg border-[#ef4444]/50"}`}>{sgnPct(r.wkReturn)}</span>
                    )}
                  </div>
                  <div className="text-[10px] muted uppercase tracking-wider">{r.sector||r.rating||""}</div>
                  <div className="grid grid-cols-2 gap-2 mt-3 text-center">
                    <div>
                      <div className="text-[9px] muted uppercase">{r.price?"Price":"Yield"}</div>
                      <div className="mono text-sm">{r.price?"$"+fmt(r.price):fmt(r.yield,2)+"%"}</div>
                    </div>
                    <div>
                      <div className="text-[9px] muted uppercase">{r.pe?"Price Score":"Maturity"}</div>
                      <div className="mono text-sm">{r.pe?fmt(r.pe,1):r.maturity||"—"}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function SimpleRiskModule({ navigate }){
  const rows = buildPortfolioRows();
  const total = rows.reduce((a,b)=>a+b.value,0);
  const sectorVol = { Technology:0.30, Finance:0.22, Energy:0.28, Consumer:0.26, Healthcare:0.16, Industrials:0.23 };
  const riskRows = rows.map(r=>{
    const w = r.value/total;
    const rc = w * (sectorVol[r.sector]||0.22);
    return { ticker:r.ticker, sector:r.sector, riskContrib:rc };
  });
  const rcSum = riskRows.reduce((a,b)=>a+b.riskContrib,0);
  riskRows.forEach(r=>r.riskPct = (r.riskContrib/rcSum)*100);
  riskRows.sort((a,b)=>b.riskPct-a.riskPct);

  return (
    <div className="space-y-3 max-w-6xl mx-auto">
      <div className="panel p-5">
        <div className="text-lg font-semibold">How Risky Is My Portfolio?</div>
        <div className="text-sm muted mt-1">Six quick checks on what could go wrong — green is healthy, red needs attention.</div>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <MetricCard label="Estimated Worst Day" value={RISK_METRICS.var95.value} valueClass="neg" signal={signal("var", -42180)} explainer="There's a 5% chance you lose more than this tomorrow" />
        <MetricCard label="Risk-Adjusted Return Score" value={RISK_METRICS.sharpe.value} signal={signal("sharpe", 1.42)} explainer="Higher is better — more return per unit of risk" />
        <MetricCard label="Market Sensitivity" value={RISK_METRICS.beta.value} signal={signal("beta", 1.18)} explainer="1.0 moves with the market; over 1 amplifies swings" />
        <MetricCard label="How Much You Drift from the Market" value={RISK_METRICS.trackingError.value} explainer="How different your returns look from the broader market" />
        <MetricCard label="Worst Drop Ever Recorded" value={RISK_METRICS.maxDrawdown.value} valueClass="neg" signal={signal("maxDD", -18.6)} explainer="The biggest peak-to-trough loss your portfolio has endured" />
        <MetricCard label="How Bumpy the Ride Is" value={RISK_METRICS.volatility.value} signal={signal("vol", 22.4)} explainer="Average annual swing in either direction" />
      </div>

      <div className="panel">
        <div className="panel-header px-3 py-2 text-xs uppercase tracking-widest muted">Which Holdings Drive The Most Risk</div>
        <div className="p-4">
          <div className="text-xs muted mb-3">The bars show each stock's contribution to total portfolio risk. Bigger bar = bigger risk driver.</div>
          {riskRows.map(r=>(
            <div key={r.ticker} className="flex items-center gap-3 py-2 cursor-pointer hover:bg-[#1c2128] px-2 -mx-2" onClick={()=>navigate(r.ticker+" EQ")}>
              <div className="w-16 mono accent text-sm">{r.ticker}</div>
              <div className="w-24 text-xs muted">{r.sector}</div>
              <div className="flex-1 h-3 bg-[#0d1117] border border-[#21262d]">
                <div className="h-full accent-bg" style={{width:Math.min(r.riskPct*1.5,100)+"%", opacity:0.85}}></div>
              </div>
              <div className="w-14 text-right mono text-xs">{fmt(r.riskPct)}%</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============== ROOT ==============
function App(){
  const [view, setView] = useState({ mod:"MENU" });
  const [time, setTime] = useState("");
  const [flash, setFlash] = useState("");
  const [history, setHistory] = useState([]);
  const [showHelp, setShowHelp] = useState(false);
  const [mode, setMode] = useState(()=>{ try { return localStorage.getItem("openticker.mode") || "pro"; } catch { return "pro"; } });
  const [transitioning, setTransitioning] = useState(false);
  const switchMode = (m) => {
    if(m===mode) return;
    setTransitioning(true);
    setTimeout(()=>{ setMode(m); try { localStorage.setItem("openticker.mode", m); } catch {} }, 100);
    setTimeout(()=>setTransitioning(false), 250);
  };

  // ---- Data feeds / API connections ----
  const [nowMs, setNowMs] = useState(Date.now());
  const [feeds, setFeeds] = useState(()=>{
    const blank = {};
    DATA_FEEDS.forEach(f=>{ blank[f.id] = { key:"", state:"disconnected", lastUpdated:null, error:null }; });
    try {
      const saved = JSON.parse(localStorage.getItem("openticker.feeds.v1"));
      if(saved) DATA_FEEDS.forEach(f=>{
        if(saved[f.id]) blank[f.id] = { key:saved[f.id].key||"", state:saved[f.id].state||"disconnected",
          lastUpdated:(saved[f.id].state==="connected"||saved[f.id].state==="demo")?Date.now():null, error:null };
      });
    } catch {}
    return blank;
  });
  const [showSetup, setShowSetup] = useState(()=>{
    try { return !localStorage.getItem("openticker.feeds.v1"); } catch { return true; }
  });
  const persistFeeds = (next) => {
    try {
      const slim = {};
      Object.entries(next).forEach(([id,fs])=>{ slim[id] = { key:fs.key, state:fs.state==="testing"?"disconnected":fs.state }; });
      localStorage.setItem("openticker.feeds.v1", JSON.stringify(slim));
    } catch {}
  };
  const setFeedKey = (id, key) => setFeeds(p=>({ ...p, [id]:{ ...p[id], key } }));
  const testFeed = async (id) => {
    const key = feeds[id]?.key || "";
    setFeeds(p=>({ ...p, [id]:{ ...p[id], state:"testing", error:null } }));
    const res = await testApiKey(key);
    setFeeds(p=>{
      const next = { ...p, [id]: res.ok
        ? { ...p[id], state:"connected", lastUpdated:Date.now(), error:null }
        : { ...p[id], state:"error", lastUpdated:null, error:res.error } };
      persistFeeds(next);
      return next;
    });
  };
  const useDemoData = () => {
    setFeeds(p=>{
      const next = {};
      DATA_FEEDS.forEach(f=>{ next[f.id] = { key:p[f.id].key, state:"demo", lastUpdated:Date.now(), error:null }; });
      persistFeeds(next);
      return next;
    });
    setShowSetup(false);
    setFlash("Demo data enabled across all feeds");
  };
  const disconnectFeed = (id) => {
    setFeeds(p=>{
      const next = { ...p, [id]:{ key:"", state:"disconnected", lastUpdated:null, error:null } };
      persistFeeds(next);
      return next;
    });
  };
  const refreshFeed = (id) => setFeeds(p=> p[id]?.state==="connected" ? ({ ...p, [id]:{ ...p[id], lastUpdated:Date.now() } }) : p);
  const finishSetup = () => { setFeeds(p=>{ persistFeeds(p); return p; }); setShowSetup(false); };

  // Simulated live polling — bumps "last updated" for connected feeds
  useEffect(()=>{
    const iv = setInterval(()=>{
      setFeeds(prev=>{
        let changed=false; const next={...prev}; const now=Date.now();
        DATA_FEEDS.forEach(f=>{
          const fs = next[f.id];
          if(fs.state==="connected" && (!fs.lastUpdated || now-fs.lastUpdated >= f.pollSeconds*1000)){
            next[f.id] = { ...fs, lastUpdated:now }; changed=true;
          }
        });
        return changed ? next : prev;
      });
    }, 3000);
    return ()=>clearInterval(iv);
  },[]);

  // Watchlist + alerts
  const [watchlist, setWatchlist] = useState(["AAPL","NVDA","TSLA","META"]);
  const [alerts, setAlerts] = useState([
    { id:"seed1", ticker:"AAPL", direction:"above", threshold:225.00 },
    { id:"seed2", ticker:"TSLA", direction:"below", threshold:260.00 },
  ]);
  // Triggered alerts: evaluate immediately based on current mock prices
  const triggered = useMemo(()=>alerts.filter(a=>{
    const p = EQUITIES[a.ticker]?.price; if(p==null) return false;
    return a.direction==="above" ? p>=a.threshold : p<=a.threshold;
  }).map(a=>a.id),[alerts]);

  useEffect(()=>{
    const tick = ()=>{
      const d = new Date();
      const opts = { weekday:'short', year:'numeric', month:'short', day:'2-digit' };
      setTime(d.toLocaleDateString('en-US', opts) + " · " + d.toLocaleTimeString('en-US',{hour12:false}) + " EDT");
      setNowMs(Date.now());
    };
    tick();
    const i = setInterval(tick, 1000);
    return ()=>clearInterval(i);
  },[]);

  const navigate = useCallback((raw)=>{
    if(raw && raw.startsWith("__NL_UNKNOWN__:")){
      setFlash("I'm not sure what you mean — try \"Show me Apple\" or \"How is the economy?\"");
      return;
    }
    const cmd = raw.replace(/<GO>/i,"").trim().toUpperCase();
    if(!cmd) return;
    setHistory(h=>{
      const next = h.filter(x=>x!==cmd); next.push(cmd);
      return next.slice(-50);
    });
    const parts = cmd.split(/\s+/);
    const EQ_FNS = { EQ:"Equity", DES:"Description", GP:"Price Graph", GIP:"Intraday Graph", HP:"Historical Price", FA:"Financial Analysis", ANR:"Analyst Recommendations", DVD:"Dividends", ERN:"Earnings" };
    if(parts.length>=2 && EQ_FNS[parts[1]]){
      const tk = parts[0], fn = parts[1];
      if(EQUITIES[tk]){
        setView({mod:"EQ", ticker:tk, focus: fn==="EQ"?null:fn});
        setFlash(`Loaded ${tk} ${fn}${fn==="EQ"?"":" — "+EQ_FNS[fn]}`);
        return;
      }
      setFlash(`Unknown ticker: ${tk}`); return;
    }
    if(EQUITIES[parts[0]]){ setView({mod:"EQ",ticker:parts[0]}); setFlash(`Loaded ${parts[0]} EQ`); return; }
    switch(parts[0]){
      case "MACRO": case "ECST": setView({mod:"MACRO"}); setFlash("Loaded Macro Dashboard"); break;
      case "FX": case "FXC":     setView({mod:"FX"});     setFlash("Loaded FXC — Currency Rates"); break;
      case "NEWS": case "N": case "TOP": setView({mod:"NEWS"}); setFlash("Loaded News Feed"); break;
      case "PORT":   setView({mod:"PORT"});   setFlash("Loaded Portfolio"); break;
      case "BQL":    setView({mod:"BQL"});    setFlash("Loaded BQL Query Engine"); break;
      case "RISK":   setView({mod:"RISK"});   setFlash("Loaded Risk Analytics"); break;
      case "STRESS": setView({mod:"STRESS"}); setFlash("Loaded Stress Test"); break;
      case "YCRV":   setView({mod:"YCRV"});   setFlash("Loaded Yield Curve"); break;
      case "SCRN": case "EQS":   setView({mod:"SCRN"});   setFlash("Loaded EQS — Equity Screening"); break;
      case "WATCH":  setView({mod:"WATCH"});  setFlash("Loaded Watchlist"); break;
      case "ASKB":   setView({mod:"ASKB"});   setFlash("Loaded AI Assistant"); break;
      case "COMP":   setView({mod:"COMP"});   setFlash("Loaded COMP — Comparative Returns"); break;
      case "ECON": case "ECO":   setView({mod:"ECON"});   setFlash("Loaded ECO — Economic Calendar"); break;
      case "MENU":   setView({mod:"MENU"});   setFlash("Loaded Main Menu"); break;
      case "CONN": case "API": setView({mod:"CONN"}); setFlash("Loaded Data Connections"); break;
      case "SETUP":  setShowSetup(true);      setFlash("Opened connection setup"); break;
      case "HELP":   setShowHelp(true);       setFlash("Help opened"); break;
      default:       setFlash(`Unknown command: ${cmd} — try HELP <GO>`);
    }
  },[]);

  useEffect(()=>{
    if(!flash) return;
    const t = setTimeout(()=>setFlash(""), 2500);
    return ()=>clearTimeout(t);
  },[flash]);

  const moduleName =
    view.mod==="EQ" ? `${view.ticker} EQUITY` :
    view.mod==="MACRO" ? "MACRO DASHBOARD" :
    view.mod==="FX" ? "FXC — CURRENCY RATES" :
    view.mod==="NEWS" ? "NEWS FEED" :
    view.mod==="PORT" ? "PORTFOLIO" :
    view.mod==="BQL" ? "BQL QUERY ENGINE" :
    view.mod==="RISK" ? "RISK ANALYTICS" :
    view.mod==="STRESS" ? "STRESS TESTING" :
    view.mod==="YCRV" ? "YIELD CURVE" :
    view.mod==="SCRN" ? "EQS — EQUITY SCREENING" :
    view.mod==="WATCH" ? "WATCHLIST" :
    view.mod==="ASKB" ? "AI ASSISTANT" :
    view.mod==="COMP" ? "COMPARISON" :
    view.mod==="ECON" ? "ECO — ECONOMIC CALENDAR" :
    view.mod==="CONN" ? "DATA CONNECTIONS" :
    view.mod==="MENU" ? "MAIN MENU" : "—";

  const isSimple = mode==="simple";
  const showDrawer = isSimple && view.mod !== "ASKB";

  return (
    <div className="min-h-screen flex flex-col">
      <TopBar moduleName={moduleName} time={time} alerts={alerts} triggered={triggered} navigate={navigate} mode={mode} setMode={switchMode} feeds={feeds} />
      {isSimple && <SimpleSearchBar onSubmit={navigate} />}
      <div className="flex-1 flex overflow-hidden" style={{opacity: transitioning ? 0 : 1, transition:"opacity 200ms"}}>
        <div className="flex-1 p-2 overflow-auto">
          {MODULE_FEED[view.mod] && (
            <FeedStatusBar feed={DATA_FEEDS.find(f=>f.id===MODULE_FEED[view.mod])} fs={feeds[MODULE_FEED[view.mod]]} navigate={navigate} onRefresh={refreshFeed} now={nowMs} />
          )}
          {view.mod==="EQ"     && (isSimple ? <SimpleEquityModule    ticker={view.ticker} navigate={navigate} /> : <EquityModule    ticker={view.ticker} navigate={navigate} focus={view.focus} />)}
          {view.mod==="MACRO"  && (isSimple ? <SimpleMacroModule />                                              : <MacroModule />)}
          {view.mod==="FX"     && <FXModule />}
          {view.mod==="NEWS"   && <NewsModule navigate={navigate} />}
          {view.mod==="PORT"   && (isSimple ? <SimplePortfolioModule navigate={navigate} />                       : <PortfolioModule navigate={navigate} />)}
          {view.mod==="BQL"    && (isSimple ? <SimpleBQLModule       navigate={navigate} />                       : <BQLModule       navigate={navigate} />)}
          {view.mod==="RISK"   && (isSimple ? <SimpleRiskModule      navigate={navigate} />                       : <RiskModule      navigate={navigate} />)}
          {view.mod==="STRESS" && <StressModule navigate={navigate} />}
          {view.mod==="YCRV"   && (isSimple ? <SimpleYCRVModule />                                                : <YCRVModule />)}
          {view.mod==="SCRN"   && <ScreenerModule navigate={navigate} />}
          {view.mod==="WATCH"  && <WatchlistModule watchlist={watchlist} setWatchlist={setWatchlist} alerts={alerts} setAlerts={setAlerts} triggered={triggered} navigate={navigate} />}
          {view.mod==="ASKB"   && <AskBModule />}
          {view.mod==="COMP"   && (isSimple ? <SimpleCompModule navigate={navigate} />                            : <CompModule navigate={navigate} />)}
          {view.mod==="ECON"   && (isSimple ? <SimpleEconModule />                                                : <EconModule />)}
          {view.mod==="CONN"   && <ConnectionsModule feeds={feeds} onChangeKey={setFeedKey} onTest={testFeed} onDisconnect={disconnectFeed} onDemo={useDemoData} nowMs={nowMs} />}
          {view.mod==="MENU"   && (isSimple ? <SimpleHome navigate={navigate} />                                  : <MenuModule navigate={navigate} />)}
        </div>
        {showDrawer && <SimpleAIDrawer view={view} navigate={navigate} />}
      </div>
      {flash && (
        <div className="px-3 py-1 text-[11px] mono accent border-t border-[#21262d] bg-[#1c2128]">» {flash}</div>
      )}
      {!isSimple && <CommandBar onSubmit={navigate} history={history} />}
      {showHelp && <HelpModal onClose={()=>setShowHelp(false)} navigate={navigate} />}
      {showSetup && <ApiSetupModal feeds={feeds} onChangeKey={setFeedKey} onTest={testFeed} onDisconnect={disconnectFeed} onDemo={useDemoData} onFinish={finishSetup} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
