<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle CRT scanline pattern -->
    <pattern id="scan" patternUnits="userSpaceOnUse" width="1024" height="14">
      <rect width="1024" height="14" fill="#0c1a14"/>
      <line x1="0" y1="7" x2="1024" y2="7" stroke="#1d3a2a" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Graphite background with rounded corners and scanlines -->
  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="#0c1a14"/>
    <rect width="1024" height="1024" fill="url(#scan)"/>
  </g>

  <!-- ">" prompt — bold chevron -->
  <path d="M 240 340 L 460 512 L 240 684"
        stroke="#22c55e"
        stroke-width="86"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- Cursor block -->
  <rect x="540" y="470" width="240" height="84" rx="14" ry="14" fill="#22c55e"/>
</svg>
